<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3D5AFE"><link rel="manifest" href="/api/manifest"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Coachpilot">
<style>:root{color-scheme:light}html,body{background:#ECEFF5}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><style id="live-safe">.topbar{top:calc(12px + env(safe-area-inset-top,0px))!important}.page-in{padding-top:calc(20px + env(safe-area-inset-top,0px))!important}.threadv{padding-top:0!important}.thbar{top:0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head><body>
<title>Coachpilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-screen map, floating search + chips on top, floating bottom sheet with cards, floating pill tab bar. Soft cards, one blue accent, yellow for active chips, dark price pins. */
:root{
  --navb:max(6px,calc(env(safe-area-inset-bottom,0px) - 16px));
  --bg:#ECEFF5; --card:#FFFFFF; --soft:#F1F3F8; --ink:#14161F; --muted:#6F7487; --line:#E2E5ED;
  --land:#FAFAFB; --water:#E3EEF8; --road:#FFFFFF; --road-edge:#E2E4EA; --coast:#D9DCE3;
  --accent:#3D5AFE; --accent-ink:#FFFFFF; --accent-soft:#E9EDFF;
  --yellow:#FFC83D; --yellow-ink:#1E1600; --pin:#FFFFFF; --pin-ink:#14161F;
  --ok:#17A35B; --ok-soft:#E5F6EC; --warn:#E08A00; --warn-soft:#FFF3DC;
  --shadow:0 6px 20px rgb(20 22 31 / .07),0 1px 3px rgb(20 22 31 / .06);
  color-scheme:light;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none}
.app{height:100%;position:relative}
.view{position:absolute;inset:0}
.view[hidden]{display:none!important}

/* ---- map ---- */
.mapwrap{position:absolute;inset:0;overflow:hidden;background:var(--water);touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.mapwrap > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.city{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;pointer-events:none}
.country{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--muted);opacity:.5;pointer-events:none;white-space:nowrap}
.pin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border:0;padding:0;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--card);box-shadow:0 4px 12px rgb(61 90 254 / .35);transition:transform .15s}
.pin svg{width:17px;height:17px}
.pin.sel{transform:translate(-50%,-50%) scale(1.25);background:var(--yellow);color:var(--yellow-ink);box-shadow:0 0 0 8px color-mix(in srgb,var(--yellow) 30%,transparent),0 4px 12px rgb(0 0 0 / .2);z-index:6}
.pin.dim{opacity:.3}
.hpin{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);border:1px solid var(--line);background:var(--pin);color:var(--pin-ink);border-radius:8px;padding:4px 8px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 8px rgb(20 22 31 / .1);font-variant-numeric:tabular-nums;white-space:nowrap}
.hpin::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pin);border-bottom:0}
.hpin svg{width:13px;height:13px;color:var(--accent)}

/* floating top */
.topbar{position:absolute;top:12px;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:10}
.topbar > *{pointer-events:auto}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;height:50px;box-shadow:var(--shadow);color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink);font-weight:500}
.search input::placeholder{color:var(--muted)}
.iconbtn{width:50px;height:50px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn.acc{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:132px;display:flex;flex-direction:column;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:9}
.zoom button{width:44px;height:42px;border:0;background:none;font-size:20px;font-weight:600;display:grid;place-items:center}
.zoom button + button{border-top:1px solid var(--line)}
.mapside{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:132px;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:9}
.mapside .zoom{position:static}
.addfab{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgb(61 90 254 / .35),0 2px 6px rgb(20 22 31 / .15);cursor:pointer;transition:transform .15s}
.addfab:active{transform:scale(.92)}.addfab svg{width:22px;height:22px}
body.picking .mapside{display:none}
.locbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink,#14161F);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.locbtn svg{width:22px;height:22px}.locbtn.on{color:#1A73E8}.locbtn.wait svg{animation:spSpin 1.2s linear infinite}
.laypop{position:absolute;right:56px;top:0;width:260px;background:var(--card);border-radius:18px;box-shadow:0 12px 32px rgb(20 22 31 / .2);padding:10px;display:flex;flex-direction:column;gap:2px;z-index:20}
.layhd{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 8px 6px}
.layrow{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 8px;border-radius:12px;text-align:left;cursor:pointer;width:100%;color:inherit}
.layrow:active{background:var(--soft)}.layic{width:30px;height:30px;display:grid;place-items:center;font-size:20px;flex:none}.layic img{width:30px;height:30px;border-radius:8px}
.laytx{flex:1;min-width:0;display:flex;flex-direction:column}.laytx b{font-size:14px}.laytx small{font-size:12px;color:var(--muted)}
.sw{width:40px;height:24px;border-radius:12px;background:#D5D9E3;position:relative;flex:none;transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(16px)}
.laynote{margin:4px 8px 2px;font-size:12px;color:var(--muted)}
.zlabel{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgb(0 0 0 / .2);font-size:12px;font-weight:800;color:#166534;white-space:nowrap;z-index:4;cursor:pointer;pointer-events:auto;border:2px solid #16A34A}
.zlabel.ze{color:#5B21B6;border-color:#7C3AED}.zlabel.fut{border-style:dashed}
.zlabel .zl-ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#E8F5E9}.zlabel.ze .zl-ic{background:#F1E9FF}
.zlabel.dot{padding:2px}.zlabel.dot .zl-tx{display:none}
.zlegend{position:absolute;left:16px;top:120px;z-index:8;display:flex;gap:9px;align-items:center;max-width:calc(100% - 92px);background:var(--card);border-radius:10px;padding:5px 9px;box-shadow:var(--shadow);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden}
.zlegend .lg{display:flex;align-items:center;gap:5px}.zlegend i{width:14px;height:10px;border-radius:3px;background:rgb(22 163 74 / .3);border:2px solid #15803D}.zlegend i.ze{background:rgb(124 58 237 / .3);border-color:#6D28D9}.zlegend i.fut{background:none;border:2px dashed #6B7280}
.zlegend .lgtip{flex-basis:100%;font-size:11px;font-weight:600;color:var(--muted)}
body.picking .zlegend{display:none}
.ztag.fut{background:#FFF7E6;color:#92400E;box-shadow:inset 0 0 0 1.5px #F59E0B}.ztag.now{background:#E8F5E9;color:#166534}
.zfuture{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:#FFF7E6;border:1.5px dashed #F59E0B}.zfuture b{display:block;color:#92400E}.zfuture span{font-size:13px;color:#78350F}.zf-ic{font-size:20px}
.zactive{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#166534;background:#E8F5E9;padding:5px 10px;border-radius:999px}.zdot{width:8px;height:8px;border-radius:50%;background:#16A34A;box-shadow:0 0 0 3px rgb(22 163 74 / .25)}
.mepin{position:absolute;width:0;height:0;pointer-events:none;z-index:8}
.mepin .me-dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 1px 6px rgb(0 0 0 / .35)}
.mepin .me-acc{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:rgb(26 115 232 / .22);animation:mePulse 2s ease-out infinite}
@keyframes mePulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes spSpin{to{transform:rotate(360deg)}}
.pickcard .r{flex-wrap:wrap}
.picksub{display:block;font-size:13px;color:var(--muted);margin:4px 0 2px;line-height:1.4}
.probtn{flex:none;height:50px;padding:0 13px;border:0;border-radius:16px;background:linear-gradient(135deg,#FFE08A,#F5B83D);color:#5A3B00;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;box-shadow:var(--shadow);cursor:pointer}
.probtn span{font-size:14px}

/* ---- sheet ---- */
.sheet{position:absolute;left:0;right:0;bottom:calc(72px + var(--navb));z-index:11;pointer-events:none}
.sheet > *{pointer-events:auto}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.shead{display:flex;justify-content:space-between;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.shead h2{margin:0;font-size:16px;font-weight:800;background:var(--card);padding:6px 12px;border-radius:10px;box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.link{border:0;background:var(--card);color:var(--accent);font-weight:700;font-size:13px;padding:6px 12px;border-radius:10px;box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.ccard{flex:none;width:272px;scroll-snap-align:start;background:var(--card);border:0;border-radius:18px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left}
.cic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cic svg{width:20px;height:20px}
.ct{min-width:0;display:block;font-size:12px;color:var(--muted);line-height:1.35}
.ct > b{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .hl{display:inline}
.pcard{flex:none;width:236px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--shadow);border:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.thumb{height:104px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--soft));display:grid;place-items:center;color:var(--accent)}
.thumb .bus{width:84px;height:84px;opacity:.9}
.thumb .badge{position:absolute;top:8px;left:8px;background:var(--card);color:var(--ink);font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px;display:flex;gap:4px;align-items:center}
.thumb .badge svg{width:12px;height:12px}
.thumb .badge.h{left:auto;right:8px;color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:7px}
.pcard .b{padding:0 4px 4px;display:flex;flex-direction:column;gap:5px}
.pcard h3{margin:0;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .loc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.pcard .loc svg{width:13px;height:13px}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.price{color:var(--accent);font-weight:800;font-size:15px}
.price small{font-weight:600;color:var(--muted);font-size:11px}

.panel{background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgb(20 22 31 / .07);display:flex;flex-direction:column;max-height:calc(100vh - 210px);margin-bottom:calc(-72px - var(--navb));padding-bottom:calc(72px + var(--navb))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 2px;flex:none}
.pscroll{overflow-y:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;min-height:0}
.ptop{display:flex;justify-content:space-between;align-items:center}
.roundbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:0;background:var(--soft);border-radius:18px;padding:8px;text-align:left;width:100%}
.lrow .thumb{height:64px;border-radius:13px}
.lrow .thumb .bus{width:46px;height:46px}
.lrow h3{margin:0;font-size:14px;font-weight:700;line-height:1.25}
.lrow .loc{font-size:12px;color:var(--muted)}
.lrow .meta{text-align:right;padding-right:6px}
.lrow .meta div{font-size:11px;color:var(--muted);font-weight:600}
.hl{font-size:12px;font-weight:700;color:var(--ok)}

/* detail */
.dhero{height:96px;border-radius:20px;position:relative;background:linear-gradient(135deg,var(--accent-soft),var(--soft));display:grid;place-items:center;color:var(--accent);flex:none}
.dhero .bus{width:72px;height:72px}
.dhero .roundbtn{position:absolute;top:10px;background:var(--card);box-shadow:0 2px 8px rgb(20 22 31 / .1)}
.dhero .back{left:10px}.dhero .nav{right:10px;background:var(--accent);color:var(--accent-ink)}
.dtitle{display:flex;flex-direction:column;gap:6px}
.dtitle h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
.dtitle .loc{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.stat .ic{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.stat .ic svg{width:15px;height:15px}
.stat + .stat{margin-left:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:4px;flex:none}
.seg button{border:0;background:none;border-radius:11px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.svc{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;padding:10px;border-radius:14px;background:var(--soft)}
.svc .ic{width:30px;height:30px;border-radius:10px;background:var(--card);display:grid;place-items:center;color:var(--accent);flex:none}
.svc .ic svg{width:16px;height:16px}
.svc.off{opacity:.4}
.svc.off span{text-decoration:line-through}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar .chip{box-shadow:none;background:var(--soft)}
.datebar .chip[aria-pressed="true"]{background:var(--yellow)}
.datebar input{border:0;background:var(--soft);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600}
.hotel{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--soft)}
.hotel .hic{width:52px;height:52px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--accent)}
.hotel .hic svg{width:24px;height:24px}
.hotel h4{margin:0;font-size:14px;font-weight:700}
.hotel .hs{font-size:12px;color:var(--muted)}
.hotel .pr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.hotel a{grid-column:2/-1;justify-self:start;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
.note{font-size:12px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.bookbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 4px max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);flex:none}
.bookbar .lbl{font-size:12px;color:var(--muted);font-weight:600}
.bookbar .price{font-size:20px}
.btn{border:0;background:var(--soft);border-radius:14px;padding:12px 18px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgb(61 90 254 / .2)}
.btn.wide{flex:1;max-width:220px}

/* ---- tab bar ---- */
nav.tabs{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--navb);z-index:20;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;gap:4px;padding:6px;width:min(340px,calc(100% - 32px))}
nav.tabs button{flex:1;border:0;background:none;border-radius:16px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---- pages ---- */
.page{overflow-y:auto;height:100%}
.page-in{max-width:680px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.page h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.lede{color:var(--muted);margin:-8px 0 0;max-width:60ch}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 2px 12px rgb(20 22 31 / .05)}
.compose{display:flex;flex-direction:column;gap:10px}
.compose input,.compose textarea,.compose select{border:0;border-radius:14px;background:var(--soft);padding:12px 14px;width:100%;outline:none}

.post p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.av{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.who{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-weight:600}
.backlink{align-self:flex-start;border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;color:var(--accent);box-shadow:0 2px 8px rgb(20 22 31 / .06)}

.reply{background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}

.sec{font-size:15px;font-weight:800;margin:4px 0 -4px}


.results{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:50vh;overflow-y:auto}

.tbody{min-width:0}

.ptag{color:var(--accent);font-weight:600}

.fpost{display:flex;flex-direction:column;gap:10px}

.fpost .body{margin:0;white-space:pre-wrap;line-height:1.55}
.pfoot{display:flex;justify-content:space-between;align-items:center}
.num{font-size:12px;color:var(--muted);font-weight:700}
.like{border:0;background:var(--soft);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted)}

.gate{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}

.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}

.auth{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto}
.auth-in{max-width:420px;margin:0 auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin:8px 0 6px}
.logo .lmark{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgb(61 90 254 / .25);margin-bottom:8px}

.ccard{grid-template-columns:44px 1fr auto}

.crow .av{width:40px;height:40px;font-size:15px}

.clink{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;border:0;background:var(--soft);border-radius:10px;padding:4px 10px 4px 4px;margin-top:6px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink)}
.uhead{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.uhead h2{margin:0;font-size:20px;font-weight:800}
.facts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.facts2 span{display:block;font-size:11px;color:var(--muted);font-weight:600}

.cos{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cocard{flex:none;width:140px;border:0;background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 2px 12px rgb(20 22 31 / .05)}

.logo-sq.img{background:#fff;border:1px solid var(--line);overflow:hidden}

.logo-wide{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px 18px;min-height:96px}

.chead{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.chead .btn{align-self:flex-start}
img.av{object-fit:cover;border-radius:50%;display:inline-block;background:var(--soft)}
.av{flex:none}
.avedit{position:relative;border:0;background:none;padding:0;width:64px;height:64px}
.avedit .cam{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 2px 6px rgb(0 0 0 / .15);display:grid;place-items:center;font-size:13px}
.photorow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:200;max-width:calc(100% - 32px)}
.cocard .logo-sq.img{width:40px;height:40px}

.seg{position:sticky;top:-8px;z-index:3;box-shadow:0 0 0 6px var(--card)}
.page .seg,.auth .seg{box-shadow:none;position:static}
.seg button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:2px;padding-right:2px}
.hotel{grid-template-columns:44px minmax(0,1fr) auto}
.hotel .hic{width:44px;height:44px}
.services{grid-template-columns:repeat(auto-fill,minmax(min(140px,45%),1fr))}
.stats{gap:10px 14px}.stat + .stat{margin-left:0}
.rsum{grid-template-columns:auto minmax(0,1fr)}
.pscroll > *{min-width:0}

.tmain{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}

<script>
/* ---------- LIVE: Supabase-koppeling (alleen actief als CP_CONFIG en supabase-js geladen zijn) ---------- */
const CFG=window.CP_CONFIG||null;
const LIVE=!!(CFG&&CFG.url&&CFG.key&&window.supabase&&window.supabase.createClient);
const sbc=LIVE?window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const LDB=(()=>{if(!LIVE)return null;
  const T="docs";
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const split=p=>{const i=p.lastIndexOf("/");return[p.slice(0,i),p.slice(i+1)]};
  const err=e=>{const x=new Error(e&&e.message||"Databasefout");x.code=e&&e.code||"db_error";return x};
  const cmp=(a,b)=>a==null&&b==null?0:a==null?-1:b==null?1:a<b?-1:a>b?1:0;
  /* realtime: één kanaal, per collectie opnieuw ophalen */
  const watchers=new Map();let chan=null;
  function fire(coll){const s=watchers.get(coll);if(s)s.forEach(f=>f())}
  function fireAll(){watchers.forEach(s=>s.forEach(f=>f()))}
  function ensureChan(){if(chan)return;
    chan=sbc.channel("docs-all").on("postgres_changes",{event:"*",schema:"public",table:T},pl=>{
      const c=(pl.new&&pl.new.coll)||(pl.old&&(pl.old.coll||split(String(pl.old.path||""))[0]));if(c)fire(c)}).subscribe();
    setInterval(fireAll,30000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)fireAll()});}
  function watch(coll,refetch,onErr){ensureChan();let t=null,alive=true;

    const have=SVC_KEYS.filter(k=>(p.svc||[]).includes(k));
    if(have.length)sc.append(el("div",{class:"services"},have.map(k=>el("div",{class:"svc"},el("span",{class:"ic"},icon(SVC[k][1])),el("span",{},SVC[k][0])))));
    else sc.append(el("div",{class:"empty",style:"padding:14px"},"Nog geen voorzieningen bekend. Weet jij meer? Geef een wijziging door."));
  }else if(S.dtab==="rev"){renderReviews(sc,p);
  }else if(S.dtab==="hotels"){
    sc.append(dateBar());
    if(!hv.length)sc.append(el("div",{class:"empty"},"Op deze datum is in de buurt niets vrij. Kies een andere datum."));
    hv.forEach(h=>sc.append(el("div",{class:"hotel",id:"hotel-"+h.id},el("div",{class:"hic"},icon("i-bed")),
      el("div",{style:"min-width:0"},el("h4",{},h.name),el("div",{class:"hs"},h.dist+" km"+(h.busOk?" · bus mag bij hotel":"")+(h.chauffeur?" · chauffeurstarief":""))),
      el("div",{class:"pr"},el("span",{class:"price"},"€"+h.price,el("small",{}," /nacht")),el("span",{class:"pill"+(h.rooms<=2?" low":"")},h.rooms<=2?"Nog "+h.rooms+" kamer"+(h.rooms>1?"s":""):h.rooms+" kamers vrij")),
      el("a",{href:"https://www.booking.com/searchresults.html?ss="+encodeURIComponent(p.city)+"&checkin="+S.date,target:"_blank",rel:"noopener"},"Bekijk en boek →"))));
    sc.append(el("p",{class:"note"},"Volgeboekte hotels worden niet getoond. Prijzen en beschikbaarheid zijn voorbeelddata."));
  }else{
    const ps=C.posts.filter(x=>x.place&&x.place.id===p.id);
    if(!ps.length)sc.append(el("div",{class:"empty"},"Nog geen vragen over deze plek."));

  {const ad=adBlock("parking");if(ad)sc.append(ad)}

const starStr=n=>"★★★★★".slice(0,Math.round(n))+"☆☆☆☆☆".slice(0,5-Math.round(n));
const fmtAvg=a=>a.toFixed(1).replace(".",",");
function ratingOf(pid){const rs=(C.reviews||[]).filter(r=>r.parking===pid).sort((a,b)=>b.createdAt-a.createdAt);return{n:rs.length,avg:rs.length?rs.reduce((a,r)=>a+(r.stars||0),0)/rs.length:0,rs}}
const RV={pid:null,stars:0,tags:[],text:""};
function renderReviews(sc,p){
  const{n,avg,rs}=ratingOf(p.id);
  const counts={};rs.forEach(r=>(r.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4);
  sc.append(el("div",{class:"rsum"},el("div",{class:"big"},n?fmtAvg(avg):"–"),el("div",{},el("div",{class:"stars"},starStr(avg)),el("div",{class:"pm"},n?n+" beoordeling"+(n>1?"en":"")+" van chauffeurs":"Nog geen beoordelingen"),
    top.length?el("div",{class:"tagrow"},top.map(([t,c])=>el("span",{class:"rtag"},t+" · "+c))):null)));
  // eigen beoordeling
  const mine=rs.find(r=>r.author===C.me);
  if(RV.pid!==p.id){Object.assign(RV,{pid:p.id,stars:mine?mine.stars:0,tags:mine?[...(mine.tags||[])]:[],text:mine?mine.text||"":""})}
  if(isBanned(C.me)){sc.append(bannedNote());return}
  const f=el("form",{class:"rform"});
  f.append(el("b",{},mine?"Jouw beoordeling":"Hoe was deze parking?"));
  const sr=el("div",{class:"starpick",role:"radiogroup","aria-label":"Aantal sterren"});
  for(let i=1;i<=5;i++)sr.append(el("button",{type:"button",role:"radio","aria-checked":RV.stars===i,"aria-label":i+" ster"+(i>1?"ren":""),class:i<=RV.stars?"on":"",onclick:()=>{RV.stars=i;RV.text=f.querySelector("textarea").value;renderSheet()}},"★"));
  f.append(sr);
  f.append(el("div",{class:"tagrow"},REVIEW_TAGS.map(t=>el("button",{type:"button",class:"rtag pick","aria-pressed":RV.tags.includes(t),onclick:()=>{RV.tags=RV.tags.includes(t)?RV.tags.filter(x=>x!==t):[...RV.tags,t];RV.text=f.querySelector("textarea").value;renderSheet()}},t))));
  const ta=el("textarea",{id:"rvText",maxlength:"600",placeholder:"Tips voor anderen: inrijden, drukte, voorzieningen…"});ta.value=RV.text;f.append(ta);
  const msg=el("div",{class:"status"});f.append(msg);
  f.append(el("button",{class:"btn primary",type:"submit"},mine?"Beoordeling bijwerken":"Beoordeling plaatsen"));
  f.addEventListener("submit",async e=>{e.preventDefault();if(!RV.stars){msg.textContent="Kies eerst 1 tot 5 sterren.";return}
    const r={parking:p.id,author:C.me,stars:RV.stars,tags:RV.tags,text:ta.value.trim(),createdAt:Date.now()};
    const id=(p.id+"_"+C.me).replace(/[^A-Za-z0-9_\-.~:@+]/g,"-");
    try{if(C.db)await C.db.collection("reviews").doc(id).set(r);else{C.reviews=[...C.reviews.filter(x=>!(x.parking===p.id&&x.author===C.me)),{id,...r}]}
      RV.pid=null;renderSheet();draw();thanks("Bedankt voor jouw bijdrage!","⭐")}catch(err){msg.textContent="Opslaan lukte niet: je hebt alleen leesrechten."}});
  sc.append(f);
  rs.forEach(r=>sc.append(el("div",{class:"review"},authorLine(r.author,r.createdAt),
    el("div",{class:"r",style:"justify-content:space-between"},el("div",{class:"stars sm"},starStr(r.stars)),isMod(C.me)||r.author===C.me?confirmBtn("🗑",async()=>{if(C.db){try{await C.db.doc("reviews/"+r.id).delete()}catch(e){}}else{C.reviews=C.reviews.filter(x=>x!==r);renderSheet()}}):null),(r.tags||[]).length?el("div",{class:"tagrow"},r.tags.map(t=>el("span",{class:"rtag"},t))):null,r.text?el("p",{},r.text):null)));
}

  return C.posts.map(p=>{const t=norm(p.title),b=norm(plain(p,"body"));let sc=0;
    for(const w of words){if(t.includes(w))sc+=t.startsWith(w)||t.includes(" "+w)?3:2;else if(b.includes(w))sc+=1;else return null}
    if(t.includes(nq))sc+=3;return{p,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc||(b.p.lastAt||0)-(a.p.lastAt||0)).map(x=>x.p)}

  if(/password/i.test(m)&&/(6|short|weak)/i.test(m))return"Kies een sterker wachtwoord van minimaal 6 tekens.";
