<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D5AFE">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Coachpilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-screen map, floating search + chips on top, floating bottom sheet with cards, floating pill tab bar. Soft cards, one blue accent, yellow for active chips, dark price pins. */
:root{
  --bg:#F7F8FB; --card:#FFFFFF; --soft:#F1F3F8; --ink:#14161F; --muted:#7A7F91; --line:#E7E9F0;
  --land:#FAFAFB; --water:#E3EEF8; --road:#FFFFFF; --road-edge:#E2E4EA; --coast:#D9DCE3;
  --accent:#3D5AFE; --accent-ink:#FFFFFF; --accent-soft:#E9EDFF;
  --yellow:#FFC83D; --yellow-ink:#1E1600; --pin:#FFFFFF; --pin-ink:#14161F;
  --ok:#17A35B; --ok-soft:#E5F6EC; --warn:#E08A00; --warn-soft:#FFF3DC;
  --shadow:0 6px 20px rgb(20 22 31 / .06),0 1px 3px rgb(20 22 31 / .04);
  color-scheme:light;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none}
.app{height:100%;position:relative}
.view{position:absolute;inset:0}
.view[hidden]{display:none!important}

/* ---- map ---- */
.mapwrap{position:absolute;inset:0;overflow:hidden;background:var(--water);touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.mapwrap > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.city{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;pointer-events:none}
.country{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--muted);opacity:.5;pointer-events:none;white-space:nowrap}
.pin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border:0;padding:0;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--card);box-shadow:0 4px 12px rgb(61 90 254 / .35);transition:transform .15s}
.pin svg{width:17px;height:17px}
.pin.sel{transform:translate(-50%,-50%) scale(1.25);background:var(--yellow);color:var(--yellow-ink);box-shadow:0 0 0 8px color-mix(in srgb,var(--yellow) 30%,transparent),0 4px 12px rgb(0 0 0 / .2);z-index:6}
.pin.dim{opacity:.3}
.hpin{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);border:1px solid var(--line);background:var(--pin);color:var(--pin-ink);border-radius:8px;padding:4px 8px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 8px rgb(20 22 31 / .1);font-variant-numeric:tabular-nums;white-space:nowrap}
.hpin::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pin);border-bottom:0}
.hpin svg{width:13px;height:13px;color:var(--accent)}

/* floating top */
.topbar{position:absolute;top:12px;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:10}
.topbar > *{pointer-events:auto}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;height:50px;box-shadow:var(--shadow);color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink);font-weight:500}
.search input::placeholder{color:var(--muted)}
.iconbtn{width:50px;height:50px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn.acc{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:132px;display:flex;flex-direction:column;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:9}
.zoom button{width:44px;height:42px;border:0;background:none;font-size:20px;font-weight:600;display:grid;place-items:center}
.zoom button + button{border-top:1px solid var(--line)}

/* ---- sheet ---- */
.sheet{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:11;pointer-events:none}
.sheet > *{pointer-events:auto}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.shead{display:flex;justify-content:space-between;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.shead h2{margin:0;font-size:16px;font-weight:800;background:var(--card);padding:6px 12px;border-radius:10px;box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.link{border:0;background:var(--card);color:var(--accent);font-weight:700;font-size:13px;padding:6px 12px;border-radius:10px;box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.ccard{flex:none;width:272px;scroll-snap-align:start;background:var(--card);border:0;border-radius:18px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left}
.cic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cic svg{width:20px;height:20px}
.ct{min-width:0;display:block;font-size:12px;color:var(--muted);line-height:1.35}
.ct b{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .hl{display:inline}
.pcard{flex:none;width:236px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--shadow);border:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.thumb{height:104px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--soft));display:grid;place-items:center;color:var(--accent)}
.thumb .bus{width:84px;height:84px;opacity:.9}
.thumb .badge{position:absolute;top:8px;left:8px;background:var(--card);color:var(--ink);font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px;display:flex;gap:4px;align-items:center}
.thumb .badge svg{width:12px;height:12px}
.thumb .badge.h{left:auto;right:8px;color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:7px}
.pcard .b{padding:0 4px 4px;display:flex;flex-direction:column;gap:5px}
.pcard h3{margin:0;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .loc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.pcard .loc svg{width:13px;height:13px}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.price{color:var(--accent);font-weight:800;font-size:15px}
.price small{font-weight:600;color:var(--muted);font-size:11px}

.panel{background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgb(20 22 31 / .07);display:flex;flex-direction:column;max-height:calc(100vh - 210px);margin-bottom:calc(-84px - env(safe-area-inset-bottom,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 2px;flex:none}
.pscroll{overflow-y:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;min-height:0}
.ptop{display:flex;justify-content:space-between;align-items:center}
.roundbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:0;background:var(--soft);border-radius:18px;padding:8px;text-align:left;width:100%}
.lrow .thumb{height:64px;border-radius:13px}
.lrow .thumb .bus{width:46px;height:46px}
.lrow h3{margin:0;font-size:14px;font-weight:700;line-height:1.25}
.lrow .loc{font-size:12px;color:var(--muted)}
.lrow .meta{text-align:right;padding-right:6px}
.lrow .meta div{font-size:11px;color:var(--muted);font-weight:600}
.hl{font-size:12px;font-weight:700;color:var(--ok)}

/* detail */
.dhero{height:96px;border-radius:20px;position:relative;background:linear-gradient(135deg,var(--accent-soft),var(--soft));display:grid;place-items:center;color:var(--accent);flex:none}
.dhero .bus{width:72px;height:72px}
.dhero .roundbtn{position:absolute;top:10px;background:var(--card);box-shadow:0 2px 8px rgb(20 22 31 / .1)}
.dhero .back{left:10px}.dhero .nav{right:10px;background:var(--accent);color:var(--accent-ink)}
.dtitle{display:flex;flex-direction:column;gap:6px}
.dtitle h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
.dtitle .loc{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.stat .ic{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.stat .ic svg{width:15px;height:15px}
.stat + .stat{margin-left:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:4px;flex:none}
.seg button{border:0;background:none;border-radius:11px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgb(20 22 31 / .08)}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.svc{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;padding:10px;border-radius:14px;background:var(--soft)}
.svc .ic{width:30px;height:30px;border-radius:10px;background:var(--card);display:grid;place-items:center;color:var(--accent);flex:none}
.svc .ic svg{width:16px;height:16px}
.svc.off{opacity:.4}
.svc.off span{text-decoration:line-through}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar .chip{box-shadow:none;background:var(--soft)}
.datebar .chip[aria-pressed="true"]{background:var(--yellow)}
.datebar input{border:0;background:var(--soft);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600}
.hotel{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--soft)}
.hotel .hic{width:52px;height:52px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--accent)}
.hotel .hic svg{width:24px;height:24px}
.hotel h4{margin:0;font-size:14px;font-weight:700}
.hotel .hs{font-size:12px;color:var(--muted)}
.hotel .pr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.hotel a{grid-column:2/-1;justify-self:start;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
.note{font-size:12px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.bookbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 4px max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);flex:none}
.bookbar .lbl{font-size:12px;color:var(--muted);font-weight:600}
.bookbar .price{font-size:20px}
.btn{border:0;background:var(--soft);border-radius:14px;padding:12px 18px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgb(61 90 254 / .2)}
.btn.wide{flex:1;max-width:220px}

/* ---- tab bar ---- */
nav.tabs{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;gap:4px;padding:6px;width:min(340px,calc(100% - 32px))}
nav.tabs button{flex:1;border:0;background:none;border-radius:16px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---- pages ---- */
.page{overflow-y:auto;height:100%}
.page-in{max-width:680px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.page h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.lede{color:var(--muted);margin:-8px 0 0;max-width:60ch}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 2px 12px rgb(20 22 31 / .05)}
.compose{display:flex;flex-direction:column;gap:10px}
.compose input,.compose textarea,.compose select{border:0;border-radius:14px;background:var(--soft);padding:12px 14px;width:100%;outline:none}
.compose textarea{min-height:84px;resize:vertical}
.compose .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.compose .r select{width:auto;flex:1;min-width:150px}
.place-tag{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:0;border-radius:10px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center}
.place-tag button{border:0;background:none;padding:0;color:inherit;font-weight:800}
.page .chips{margin:0;padding:2px 0 4px}
.page .chip{box-shadow:none}
.post{background:var(--card);border:0;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;box-shadow:0 2px 12px rgb(20 22 31 / .05)}
.post h3{margin:0;font-size:15px;font-weight:700;line-height:1.3}
.post p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;font-weight:500}
.av{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.who{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-weight:600}
.backlink{align-self:flex-start;border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;color:var(--accent);box-shadow:0 2px 8px rgb(20 22 31 / .06)}
.thread .body{white-space:pre-wrap;margin:0}
.reply{background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.reply p{margin:0;white-space:pre-wrap}
.status{font-size:13px;color:var(--warn);font-weight:600}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.calc input{border:0;border-radius:14px;background:var(--soft);padding:12px 14px;color:var(--ink);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.tacho{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 2px 12px rgb(20 22 31 / .05)}
.tile.hero{background:var(--accent);color:var(--accent-ink)}
.tile span{display:block;font-size:12px;font-weight:600;opacity:.75}
.tile b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rules{display:flex;flex-direction:column}
.rules div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.rules div:last-child{border-bottom:0}
.rules b{white-space:nowrap;color:var(--accent)}
.sec{font-size:15px;font-weight:800;margin:4px 0 -4px}


.results{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:50vh;overflow-y:auto}
.hit{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;border:0;background:none;padding:8px 12px;text-align:left;width:100%}
.hit + .hit{border-top:1px solid var(--line)}
.dhero .nav{background:var(--card)!important;color:var(--muted)!important}
.dhero .nav.fav{color:#E5484D!important}
.dhero .nav.fav svg path{fill:#E5484D}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.btn.sm{padding:9px 14px;font-size:13px;white-space:nowrap}
.search.flat{box-shadow:none;height:46px;flex:none}
.list0{padding:4px 0;display:flex;flex-direction:column}
.trow,.crow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:0;background:none;text-align:left;width:100%;padding:12px 16px}
.trow + .trow,.crow + .crow{border-top:1px solid var(--line)}
.list0 .empty{padding:14px 16px}
.tbody{min-width:0}
.tbody h3{margin:0 0 2px;font-size:14px;font-weight:700;line-height:1.3}
.tbody .pm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tbody .pm span + span{margin-left:4px}
.tcount{text-align:center;min-width:52px}
.tcount b{display:block;font-size:16px;font-weight:800}
.tcount span{font-size:10px;color:var(--muted);font-weight:600}
.ptag{color:var(--accent);font-weight:600}
.trow .av{width:40px;height:40px;font-size:15px}
.av.big{width:64px;height:64px;font-size:26px}
.author{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}
.author .av{width:36px;height:36px;font-size:14px}
.author b{display:block;font-size:14px}
.author span{font-size:12px;color:var(--muted)}
.author .when{white-space:nowrap}
.fpost{display:flex;flex-direction:column;gap:10px}
.fpost.op{border:1.5px solid var(--accent-soft)}
.fpost .body{margin:0;white-space:pre-wrap;line-height:1.55}
.pfoot{display:flex;justify-content:space-between;align-items:center}
.num{font-size:12px;color:var(--muted);font-weight:700}
.like{border:0;background:var(--soft);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.like.on{background:var(--accent-soft);color:var(--accent)}
.gate{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.fl .ed{font-size:15px}
.fl input,.fl select,.fl textarea{color:var(--ink);font-weight:500;font-size:15px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
.profile h2{margin:0;font-size:20px;font-weight:800}

.auth{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto}
.auth-in{max-width:420px;margin:0 auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin:8px 0 6px}
.logo .lmark{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgb(61 90 254 / .25);margin-bottom:8px}
.logo .lmark svg{width:32px;height:32px}
.logo b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.logo span{color:var(--muted);font-size:13px}
.seg.two{grid-template-columns:1fr 1fr}
.auth .compose{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 2px 12px rgb(20 22 31 / .05)}
.auth .compose input,.auth .compose select{border:0;border-radius:14px;background:var(--soft);padding:12px 14px;width:100%;outline:none}

.thumb .ph,.dhero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero{height:clamp(84px,15vh,170px)!important;overflow:hidden}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgb(0 0 0 / .18),transparent 40%);pointer-events:none}
.dhero .roundbtn{z-index:2}
.cphoto{width:44px;height:44px;border-radius:12px;object-fit:cover;display:block}
.ccard{grid-template-columns:44px 1fr auto}
.crow .cphoto{width:40px;height:40px}
.rt{color:#B7791F;font-weight:700}
.rsum{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--soft);border-radius:18px;padding:14px}
.rsum .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stars{color:#F5A623;font-size:18px;letter-spacing:2px;line-height:1.2}
.stars.sm{font-size:14px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rtag{font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink)}
.rtag.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rform{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:18px;padding:14px}
.rform textarea{border:0;border-radius:12px;background:var(--soft);padding:10px 12px;min-height:70px;resize:vertical;outline:none}
.rform .btn{align-self:flex-start}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:none;font-size:30px;line-height:1;color:var(--line);padding:0 2px}
.starpick button.on{color:#F5A623}
.review{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.review p{margin:0;font-size:14px}
.avbtn,.namebtn{border:0;background:none;padding:0;text-align:left}
.namebtn{font-weight:700;font-size:14px;display:block;color:var(--ink)}
.crow .av{width:40px;height:40px;font-size:15px}
.logo-sq{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.logo-sq.big{width:64px;height:64px;border-radius:18px;font-size:22px}
.clink{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;border:0;background:var(--soft);border-radius:10px;padding:4px 10px 4px 4px;margin-top:6px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink)}
.uhead{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.uhead h2{margin:0;font-size:20px;font-weight:800}
.facts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.facts2 span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.facts2 b{font-size:14px}
.cos{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cocard{flex:none;width:140px;border:0;background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 2px 12px rgb(20 22 31 / .05)}
.cocard .logo-sq{width:40px;height:40px;border-radius:12px;font-size:14px}
.cocard b{font-size:13px;line-height:1.25}
.cocard span{font-size:12px;color:var(--muted)}

.logo-sq.img{background:#fff;border:1px solid var(--line);overflow:hidden}
.logo-sq.img img{width:100%;height:100%;object-fit:contain;display:block}
.logo-wide{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px 18px;min-height:96px}
.logo-wide img{max-height:72px;max-width:100%;object-fit:contain;display:block}
.chead{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.chead .btn{align-self:flex-start}
img.av{object-fit:cover;border-radius:50%;display:inline-block;background:var(--soft)}
.av{flex:none}
.avedit{position:relative;border:0;background:none;padding:0;width:64px;height:64px}
.avedit .cam{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 2px 6px rgb(0 0 0 / .15);display:grid;place-items:center;font-size:13px}
.photorow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:200;max-width:calc(100% - 32px)}
.cocard .logo-sq.img{width:40px;height:40px}

.seg{position:sticky;top:-8px;z-index:3;box-shadow:0 0 0 6px var(--card)}
.page .seg,.auth .seg{box-shadow:none;position:static}
.seg button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:2px;padding-right:2px}
.hotel{grid-template-columns:44px minmax(0,1fr) auto}
.hotel .hic{width:44px;height:44px}
.services{grid-template-columns:repeat(auto-fill,minmax(min(140px,45%),1fr))}
.stats{gap:10px 14px}.stat + .stat{margin-left:0}
.rsum{grid-template-columns:auto minmax(0,1fr)}
.pscroll > *{min-width:0}
@media (max-width:370px){.seg button{font-size:12px}.dtitle h2{font-size:20px}}
/* forum */
.fhead h1{font-size:28px}
.askbox{display:flex;align-items:center;gap:12px;border:0;background:var(--card);border-radius:20px;padding:12px 12px 12px 14px;box-shadow:0 4px 18px rgb(61 90 254 / .10);text-align:left;width:100%;border:1.5px solid var(--accent-soft)}
.askbox .av{width:38px;height:38px;font-size:14px}
.askbox > span:nth-child(2){flex:1;color:var(--muted);font-weight:500;font-size:15px;min-width:0}
.askbtn{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;border-radius:12px;padding:8px 14px}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.feed{display:flex;flex-direction:column;gap:12px}
.tcard{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 12px rgb(20 22 31 / .05);border:1.5px solid transparent}
.tcard.open{border-color:#FFE3A3}
.thead{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.thead .av{width:34px;height:34px;font-size:13px}
.tmeta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.tmeta b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta span{font-size:12px;color:var(--muted)}
.cchip{font-size:11px;font-weight:700;border-radius:8px;padding:4px 8px;white-space:nowrap}
.cchip.sm{max-width:42%;overflow:hidden;text-overflow:ellipsis}
.newb{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:3px 6px}
.tmain{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.tmain h3{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.tmain p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tfoot{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.tfoot .ptag{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFF6E0;border-radius:12px;padding:8px 8px 8px 12px;font-size:13px;font-weight:600;color:#8A5A00}
.tbadge{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:#E5484D;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
nav.tabs button{position:relative}
.thtop{display:flex;flex-direction:column;gap:8px}
.nudge{display:flex;flex-direction:column;gap:2px;background:#FFF6E0;box-shadow:none}
.nudge b{color:#8A5A00}.nudge span{color:#8A5A00;font-size:13px}
.fpost.best{border:1.5px solid #FFD66B}
.bestb{align-self:flex-start;font-size:11px;font-weight:800;color:#8A5A00;background:#FFF1CC;border-radius:8px;padding:3px 8px}
.rich{font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.rich blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0;color:var(--muted)}
.rich ul,.rich ol{margin:4px 0;padding-left:22px}
.rich a{color:var(--accent)}
.ed{border-radius:14px;background:var(--soft);overflow:hidden;border:1.5px solid transparent}
.ed:focus-within{border-color:var(--accent);background:var(--card)}
.ed-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--card)}
.ed-b{border:0;background:none;min-width:34px;height:34px;border-radius:8px;font-size:15px;color:var(--ink);display:grid;place-items:center;padding:0 6px}
.ed-b:hover{background:var(--soft)}
.ed-b.on{background:var(--accent-soft);color:var(--accent)}
.ed-bold{font-weight:800}.ed-italic{font-style:italic;font-family:Georgia,serif}.ed-underline{text-decoration:underline}.ed-strikeThrough{text-decoration:line-through}.ed-removeFormat{font-size:12px;font-weight:700;color:var(--muted)}
.ed-sep{width:1px;background:var(--line);margin:6px 4px}
.ed-link{display:flex;gap:6px;padding:6px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
.ed-link input{flex:1;min-width:140px;border:0;border-radius:10px;background:var(--soft);padding:8px 10px;outline:none}
.ed-area{font-weight:400;color:var(--ink);min-height:110px;padding:12px 14px;outline:none;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.ed-area.empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none;position:absolute}
.ed-area{position:relative}
.ed-area blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.ed-area ul,.ed-area ol{margin:4px 0;padding-left:22px}
.ed-area a{color:var(--accent)}

[hidden]{display:none!important}
.compose .chip{background:var(--soft);box-shadow:none}
.compose .chip[aria-pressed="true"]{background:var(--yellow)}
.tfoot{align-items:center}
.cchip.sm{max-width:60%}

.hwrap{padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.hcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.hc-top{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.hc-top .hic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.hc-top .hic svg{width:22px;height:22px}
.hc-mid{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hpin.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);z-index:7}
.hpin.sel svg{color:var(--accent-ink)}
.hpin.sel::after{border-top-color:var(--accent)}

@media (max-width:520px){.profile{grid-template-columns:64px minmax(0,1fr)}.profile > .btn{grid-column:1/-1;justify-self:start}}
.profile h2{overflow-wrap:anywhere}

.modb{font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.04em}
.tcard.pinned{border-color:var(--accent-soft);background:linear-gradient(var(--card),var(--card)) padding-box}
.pinb{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 7px;white-space:nowrap}
.catx{font-weight:700}
.dups{background:#FFF6E0;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;color:#8A5A00;font-size:13px}
.dup{border:0;background:var(--card);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);font-weight:600;font-size:14px}
.dup small{color:var(--muted);font-weight:500;font-size:12px}
.modbar{display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--accent);box-shadow:none}
.modbar select{border:0;border-radius:12px;background:var(--soft);padding:10px 12px;color:var(--ink);font-weight:500;font-size:14px}
.like.danger.armed{background:#FDE8E8;color:#C62828}
.reportbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.pfoot{flex-wrap:wrap;gap:8px}
.pfoot .r{gap:6px}
.repitem{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.repitem + .repitem{border-top:1px solid var(--line)}
.repitem .tbody h3{margin:0}

.edited{font-size:12px;color:var(--muted);font-style:italic}
.editbox{border:1.5px solid var(--accent)}
.modb{white-space:nowrap}

/* geen auto-zoom op iOS: invoer altijd 16px */
.page{touch-action:pan-y}
input,select,textarea,.ed-area,[contenteditable]{font-size:16px!important}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.page,.page-in,.feed,.tcard,.fpost,.compose,.card{min-width:0;max-width:100%}
.rich,.tmain h3,.thtop h1{overflow-wrap:anywhere}
.rich img{max-width:100%}
.zoomable img,img.zoomable{cursor:zoom-in}
.dhero.zoomable .roundbtn{cursor:pointer}
.lb{position:fixed;inset:0;z-index:300;background:rgb(10 12 18 / .92);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;transition:transform .2s;cursor:zoom-in;background:#fff}
.lb-img.zoom{transform:scale(2);cursor:zoom-out}
.lb-x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;border:0;background:rgb(255 255 255 / .15);color:#fff;display:grid;place-items:center}
.namebtn{display:flex!important;flex-wrap:wrap;align-items:center;gap:2px 6px;max-width:100%}
.namebtn .modb{margin-left:0}
.modb{color:#fff!important;font-size:10px!important}
.author > div{min-width:0}
.author .when{align-self:start;font-size:12px}

nav.tabs.four{width:min(420px,calc(100% - 24px))}
nav.tabs.four button{font-size:10.5px;padding-left:2px;padding-right:2px}
.sugrow{flex-wrap:wrap;gap:8px}
.phcount{position:absolute;right:10px;bottom:10px;background:rgb(0 0 0 / .55);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;z-index:2}
.formview{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.formview .page-in{padding-bottom:40px}
.fhead2{display:flex;align-items:center;gap:12px}
.fhead2 h1{margin:0}
.locrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:8px 8px 8px 12px;color:var(--ink);font-weight:600;flex-wrap:wrap}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.phitem{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);max-width:100%}
.phitem img{width:100%;height:100%;object-fit:cover;display:block}
.phitem button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgb(0 0 0 / .55);color:#fff;font-weight:800}
.phadd{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:12px;gap:2px}
.phadd span{font-size:26px;line-height:1}
.pickbar{position:fixed;inset:0;z-index:40;pointer-events:none}
.pickbar .cross{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.pickbar .cross::before,.pickbar .cross::after{content:"";position:absolute;background:var(--accent);border-radius:2px}
.pickbar .cross::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
.pickbar .cross::after{top:50%;left:0;right:0;height:3px;transform:translateY(-50%)}
.pickcard{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;pointer-events:auto;max-width:480px;margin:0 auto}
.pickcard .r{flex-wrap:wrap}
body.picking .topbar,body.picking .sheet{display:none}
.subcard{display:flex;flex-direction:column;gap:10px}
.subcard h3{margin:0;font-size:17px}
.subhead{display:flex;justify-content:space-between;align-items:center}
.diff{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:14px;padding:10px 12px}
.diff > div{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.diff > div span{color:var(--muted)}
.diff > div b{text-align:right;overflow-wrap:anywhere}
.diff s{color:var(--muted);font-weight:500}
.diff .like{align-self:flex-start}
.pill.bad{background:#FDE8E8;color:#C62828}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .15);color:#fff;font-size:28px;line-height:1}
.lb-nav.prev{left:max(10px,env(safe-area-inset-left,0px))}.lb-nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.lb-n{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:13px}
.zoom #zadd{border-top:1px solid var(--line)}

.pgrid{display:grid;gap:4px;border-radius:14px;overflow:hidden}
.pgrid.n1{grid-template-columns:1fr}.pgrid.n2{grid-template-columns:1fr 1fr}.pgrid.n3,.pgrid.n4{grid-template-columns:1fr 1fr}
.pgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.pgrid.n1 img{aspect-ratio:16/10}
.pgrid.n3 img:first-child{grid-column:1/-1}
.phgrid.sm{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.attach{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.attach .phgrid{width:100%}
.mention{border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:0 4px;font-size:inherit;line-height:inherit}
.mdrop{border-top:1px solid var(--line);background:var(--card);display:flex;flex-direction:column}
.mdrop button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:8px 12px;text-align:left}
.mdrop button + button{border-top:1px solid var(--line)}
.mdrop .av{width:30px;height:30px;font-size:12px}
.mdrop .mname{font-weight:700;font-size:14px;color:var(--ink)}
.mdrop small{color:var(--muted);font-size:12px}
.ed-mention{font-weight:800;color:var(--accent)}
.rgroup{display:flex;flex-direction:column;gap:8px}
.rthread{margin-left:18px;padding-left:12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fpost.child{padding:12px 14px;box-shadow:none;background:var(--card)}
.fpost.child .author .av{width:30px;height:30px;font-size:12px}
.replyto{font-size:12px;color:var(--muted)}
.compose.inline{box-shadow:none;border:1.5px solid var(--accent-soft)}
.fpost.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--yellow)}100%{box-shadow:0 2px 12px rgb(20 22 31 / .05)}}
.bell{position:relative;border:0;background:var(--card);width:44px;height:44px;border-radius:14px;font-size:20px;box-shadow:0 2px 10px rgb(20 22 31 / .06);flex:none}
.bcount{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#E5484D;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.fhead .phead{align-items:center}
.nrow{display:grid;grid-template-columns:40px 1fr 10px;gap:12px;align-items:center;border:0;background:none;text-align:left;width:100%;padding:12px 16px}
.nrow + .nrow{border-top:1px solid var(--line)}
.nrow.unread{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.nrow .av{width:40px;height:40px;font-size:15px}
.ntext{font-size:14px;line-height:1.35;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pfoot{justify-content:space-between}
@media (max-width:400px){.rthread{margin-left:8px;padding-left:8px}}

.uwrap{display:flex;align-items:center;gap:2px;background:var(--soft);border-radius:14px;padding:0 0 0 14px;color:var(--muted);font-weight:700}
.uwrap input{background:none!important;padding-left:2px!important;flex:1;min-width:0;border:0;outline:none;padding:12px 14px 12px 2px;color:var(--ink)}
.uwrap.locked{padding:12px 14px;color:var(--ink)}
.uwrap .uval{flex:1;font-weight:600}
.uhint{font-size:12px;font-weight:600;color:var(--muted)}
.uhint.ok{color:var(--ok)}.uhint.bad{color:#C62828}
.uname{font-size:14px;font-weight:600;color:var(--accent);margin-top:2px}

.csearch{position:relative;z-index:6}
.csearch input::-webkit-search-cancel-button{display:none}
.csearch .search{position:relative}
.sclear{border:0;background:var(--soft);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.sclear svg{width:14px;height:14px}
.sdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:16px;box-shadow:0 12px 32px rgb(20 22 31 / .16);overflow:hidden;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column}
.sitem{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:13px 16px;width:100%}
.sitem + .sitem{border-top:1px solid var(--line)}
.sitem:active,.sitem:hover{background:var(--soft)}
.sic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.sic.ok{background:#F5A623}
.sic.open{background:#fff;color:#F5A623;box-shadow:inset 0 0 0 2px #F5A623}
.stx{font-size:15px;line-height:1.35;color:var(--ink);font-weight:400;overflow-wrap:anywhere}
.stx b,.hl2 b{font-weight:800}
.hl2{display:block;font-size:14px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scnt{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:8px;padding:2px 7px}
.snone{padding:14px 16px;color:var(--muted);font-size:14px}
.sall{border:0;border-top:1px solid var(--line);background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;padding:12px 16px;text-align:left}
@media (min-width:700px){
  .topbar{right:auto;width:440px}
  .sheet{left:16px;right:auto;width:420px;top:132px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
  .panel{border-radius:26px;max-height:100%;margin:0;padding-bottom:0;box-shadow:var(--shadow);min-height:0}
  .carousel{flex-direction:column;overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const REVIEW_TAGS=["Veilig","Schoon","Ruim","Rustig 's nachts","Makkelijk in te rijden","Vaak vol","Duur","Krap"];
const photo=(cls,p)=>{const ph=photosOf(p);return el("img",{class:cls,src:ph[0]||PHOTO,alt:p?"Foto van "+p.name:"Busparking",decoding:"async"})};
const starStr=n=>"★★★★★".slice(0,Math.round(n))+"☆☆☆☆☆".slice(0,5-Math.round(n));
const fmtAvg=a=>a.toFixed(1).replace(".",",");
function ratingOf(pid){const rs=(C.reviews||[]).filter(r=>r.parking===pid).sort((a,b)=>b.createdAt-a.createdAt);return{n:rs.length,avg:rs.length?rs.reduce((a,r)=>a+(r.stars||0),0)/rs.length:0,rs}}
const RV={pid:null,stars:0,tags:[],text:""};
function renderReviews(sc,p){
  const{n,avg,rs}=ratingOf(p.id);
  const counts={};rs.forEach(r=>(r.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4);
  sc.append(el("div",{class:"rsum"},el("div",{class:"big"},n?fmtAvg(avg):"–"),el("div",{},el("div",{class:"stars"},starStr(avg)),el("div",{class:"pm"},n?n+" beoordeling"+(n>1?"en":"")+" van chauffeurs":"Nog geen beoordelingen"),
    top.length?el("div",{class:"tagrow"},top.map(([t,c])=>el("span",{class:"rtag"},t+" · "+c))):null)));
  // eigen beoordeling
  const mine=rs.find(r=>r.author===C.me);
  if(RV.pid!==p.id){Object.assign(RV,{pid:p.id,stars:mine?mine.stars:0,tags:mine?[...(mine.tags||[])]:[],text:mine?mine.text||"":""})}

      if(kind==="avatar"){const m=Math.min(img.width,img.height);sx=(img.width-m)/2;sy=(img.height-m)/2;sw=sh=m;w=h=320}
      else if(kind==="photo"){const k=Math.min(1,1280/img.width,960/img.height);w=Math.round(img.width*k);h=Math.round(img.height*k)}
      else{const k=Math.min(1,600/img.width,300/img.height);w=Math.round(img.width*k);h=Math.round(img.height*k)}

    img.onerror=()=>{URL.revokeObjectURL(url);alertMsg("Dit bestand kan niet als afbeelding gelezen worden.")};img.src=url});
